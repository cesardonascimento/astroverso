name: astro

x-podman:
  in_pod: false

services:
  n8n:
    image: docker.io/n8nio/n8n:2.47.5
    container_name: astro-n8n
    restart: always
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${OWNER_EMAIL}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${OWNER_FIRST_NAME}
      N8N_INSTANCE_OWNER_LAST_NAME: ${OWNER_LAST_NAME}
      N8N_INSTANCE_OWNER_PASSWORD_HASH_FILE: /run/secrets/owner_password_hash
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_NATIVE_PYTHON_RUNNER: "true"
    volumes:
      - ${ASTRO_STATE}/data/n8n:/home/node/.n8n:Z,U
      - ${ASTRO_STATE}/data/owner_password_hash:/run/secrets/owner_password_hash:ro,Z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 1m
      retries: 3

  n8n-runners:
    image: docker.io/n8nio/runners:2.47.5
    container_name: astro-n8n-runners
    restart: always
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://astro-n8n:5679
