name: astro

x-podman:
  in_pod: false

services:
  caddy:
    build: .
    image: localhost/astro-caddy:latest
    container_name: astro-caddy
    restart: always
    env_file: ${ASTRO_STATE}/.env
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${ASTRO_STATE}/data/etc:/etc/caddy:Z
      - ${ASTRO_STATE}/data/caddy:/data:Z
      - ${ASTRO_STATE}/data/config:/config:Z
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
