name: astro

x-podman:
  in_pod: false

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.0
    container_name: astro-homeassistant
    restart: always
    network_mode: host
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}:/config:Z
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:${HA_PORT}/manifest.json"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3
