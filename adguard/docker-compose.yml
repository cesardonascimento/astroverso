name: astro

x-podman:
  in_pod: false

services:
  adguard:
    build: .
    image: localhost/astro-adguard:latest
    container_name: astro-adguard
    restart: always
    network_mode: host
    env_file: ${ASTRO_STATE}/.env
    volumes:
      - ${ASTRO_STATE}/data/conf:/opt/adguardhome/conf:Z
      - ${ASTRO_STATE}/data/work:/opt/adguardhome/work:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${WEB_PORT:-8080}/login.html && nslookup -timeout=3 adguard.com 127.0.0.1 >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
