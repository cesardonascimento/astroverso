name: astroverso

x-podman:
  in_pod: false

services:
  caddy:
    build: .
    image: localhost/astroverso-caddy:latest
    container_name: astroverso-caddy
    restart: always
    env_file: ${ASTROVERSO_STATE}/.env
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${ASTROVERSO_STATE}/data/etc:/etc/caddy:Z
      - ${ASTROVERSO_STATE}/data/caddy:/data:Z
      - ${ASTROVERSO_STATE}/data/config:/config:Z
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
