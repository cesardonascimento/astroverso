name: astro

x-podman:
  in_pod: false

services:
  mailserver:
    image: docker.io/dovecot/dovecot:2.4.5
    container_name: astro-mailserver
    restart: always
    volumes:
      - ${ASTRO_STATE}/data/vmail:/srv/vmail:Z,U
      - ${ASTRO_STATE}/data/users:/etc/dovecot/users:ro,Z
      - ./dovecot.conf:/etc/dovecot/conf.d/astro.conf:ro,z
