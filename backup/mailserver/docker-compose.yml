name: astroverso

x-podman:
  in_pod: false

services:
  mailserver:
    image: docker.io/dovecot/dovecot:2.4.5
    container_name: astroverso-mailserver
    restart: always
    volumes:
      - ${ASTROVERSO_STATE}/data/vmail:/srv/vmail:Z,U
      - ${ASTROVERSO_STATE}/data/users:/etc/dovecot/users:ro,Z
      - ./dovecot.conf:/etc/dovecot/conf.d/astroverso.conf:ro,z
